
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Hector Nguyen | Social Card</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 30px 24px;
      border: 1px solid #333;
      border-radius: 22px;
      background: linear-gradient(145deg, #171717, #090909);
      box-shadow: 0 20px 60px #000;
      text-align: center;
    }

    .top {
      display: flex;
      justify-content: space-between;
      color: #aaa;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .avatar {
      width: 86px;
      height: 86px;
      margin: 35px auto 20px;
      display: grid;
      place-items: center;
      border: 1px solid #aaa;
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 40px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 12px 0 28px;
      color: #aaa;
      font-size: 10px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    .social {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 17px;
      border: 1px solid #444;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      text-align: left;
      transition: .2s;
    }

    .social:hover {
      background: #fff;
      color: #111;
      transform: translateY(-2px);
    }

    .social strong {
      display: block;
      font-size: 13px;
      letter-spacing: 1.5px;
    }

    .social small {
      display: block;
      margin-top: 5px;
      opacity: .65;
      font-size: 11px;
    }

    .arrow { font-size: 22px; }

    footer {
      margin-top: 30px;
      color: #777;
      font-size: 10px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <span>PERSONAL DIGITAL CARD</span>
      <span>01 / 26</span>
    </div>

    <div class="avatar">H</div>
    <h1>HECTOR NGUYEN</h1>
    <p class="subtitle">
      PERSONAL PROFILE<br>
      CONNECT WITH ME
    </p>

    <!-- Thay các URL mẫu bằng link tài khoản của bạn -->
    <a class="social" href="https://www.facebook.com/share/1c1VBDCzdf/"
       target="_blank" rel="noopener noreferrer">
      <span>
        <strong>FACEBOOK</strong>
        <small>Connect on Facebook</small>
      </span>
      <span class="arrow">↗</span>
    </a>

    <a class="social" href="https://www.instagram.com/hyuszuize?mdxt=emNkdDB2ODBtZDQy/"
       target="_blank" rel="noopener noreferrer">
      <span>
        <strong>IG</strong>
        <small>Message me on IG</small>
      </span>
      <span class="arrow">↗</span>
    </a>

    <a class="social" href="https://tiktok.com/@hyuszuize"
       target="_blank" rel="noopener noreferrer">
      <span>
        <strong>TIKTOK</strong>
        <small>Follow my TikTok</small>
      </span>
      <span class="arrow">↗</span>
    </a>

    <footer>EST. 2026 · HECTOR NGUYEN</footer>
  </main>
</body>
</html>
